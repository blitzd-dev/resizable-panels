name: Bug report
description: Something in @blitzd/resizable-panels is broken
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. A minimal reproduction is the fastest path to a fix.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps, CodeSandbox/StackBlitz link, or a minimal repo.
      placeholder: |
        1. Mount a horizontal PanelGroup with …
        2. Drag the handle …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "@blitzd/resizable-panels@0.1.0"
    validations:
      required: true
  - type: input
    id: react
    attributes:
      label: React version
      placeholder: "19.2.0"
    validations:
      required: true
  - type: dropdown
    id: browsers
    attributes:
      label: Environment
      multiple: true
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - SSR / Node
        - Other
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots, traces, or related issues.
