name: Deploy site

# Build the docs site (including Playwright prerender) on GitHub, then upload
# the static `apps/demo/dist` to Cloudflare Pages. Cloudflare does not run
# Playwright — Pages on CF cannot `su` for browser system deps.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Build library and docs site
        run: bun run build
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Create on first run; ignore "already exists".
          bunx wrangler@4 pages project create resizable-panels --production-branch=main \
            || echo "Pages project create skipped (may already exist)"
          bunx wrangler@4 pages project list
          bunx wrangler@4 pages deploy apps/demo/dist \
            --project-name=resizable-panels \
            --commit-dirty=true
