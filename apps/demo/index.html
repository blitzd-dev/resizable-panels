    <script type="application/ld+json">

        "codeRepository": "https://github.com/blitzd-dev/resizable-panels",
        "programmingLanguage": "TypeScript"
      }
    </script>
    <script>
      // Apply the saved theme before paint so there's no flash on reload.
      // Defaults to dark when nothing is stored.
      (() => {
        try {
          const stored = localStorage.getItem("resizable-panels:theme");
          const isDark = stored ? stored === "dark" : true;
          document.documentElement.classList.toggle("dark", isDark);
        } catch {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>

    <div id="root"></div>
