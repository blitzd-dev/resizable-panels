name: Publish

# Tag-triggered publish for @blitzd/resizable-panels via npm trusted publishing
# (OIDC). Configure the trusted publisher on npmjs.com — see .github/RELEASING.md.
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Required for npm OIDC trusted publishing + provenance.
      id-token: write
    defaults:
      run:
        working-directory: packages/resizable-panels
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node ≥ 22.14 and npm ≥ 11.5.1.
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install latest npm (OIDC publish support)
        run: npm install -g npm@latest
      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium firefox webkit
      - name: Build and verify entry points
        run: bun run prepack
      - name: Packed tarball smoke test
        run: bun run test:package
      - name: Publish dry-run gate
        run: bun run verify:publish
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      # No NODE_AUTH_TOKEN — a token can shadow OIDC. Provenance is automatic
      # under trusted publishing. Skip if this version is already on the
      # registry (e.g. bootstrap publish before the tag).
      - name: Publish to npm (trusted publishing / OIDC)
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "@blitzd/resizable-panels@${version}" version >/dev/null 2>&1; then
            echo "Already published @blitzd/resizable-panels@${version}; skipping."
            exit 0
          fi
          npm publish --access public
